[project]
name = "smart-orchard-inspection"
version = "1.0.0"
description = "智慧果园巡检分析系统：对接巡检无人机照片，分析果树生长状态与健康状态"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = [
    # 新版 Starlette 推荐用 httpx2 驱动 TestClient，httpx 仍可正常使用
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
