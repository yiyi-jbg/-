<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧果园巡检分析系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='13' r='10' fill='%231f7a4d'/%3E%3Crect x='14.5' y='20' width='3' height='9' rx='1.5' fill='%238a5a2b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <circle cx="16" cy="13" r="10" fill="#4fbf7f"/>
          <circle cx="12" cy="11" r="2.2" fill="#e8483f"/>
          <circle cx="19.5" cy="15" r="2.2" fill="#e8483f"/>
          <rect x="14.5" y="20" width="3" height="9" rx="1.5" fill="#c08a52"/>
        </svg>
        <span>智慧果园<small>无人机巡检分析</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#/" data-nav="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg>总览</a>
        <a href="#/upload" data-nav="upload"><svg viewBox="0 0 24 24"><path d="M12 3 6.5 8.5l1.4 1.4L11 6.8V16h2V6.8l3.1 3.1 1.4-1.4zM5 18v2h14v-2z"/></svg>上传分析</a>
        <a href="#/tasks" data-nav="tasks"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>巡检任务</a>
        <a href="#/trees" data-nav="trees"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-3.9 10.6A5 5 0 0 0 11 21.9V22h2v-.1a5 5 0 0 0 2.9-9.3A6 6 0 0 0 12 2z"/></svg>果树档案</a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>系统设置</a>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <h1 id="page-title">总览</h1>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="chart-tooltip" role="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
